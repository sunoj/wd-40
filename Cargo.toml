[package]
name = "wd40"
version = "0.6.5"
edition = "2021"
description = "WD-40 — find and clean dev build artifacts (target/, node_modules/, .next/, dist/, build/) on macOS"
license = "MIT"
repository = "https://github.com/sunoj/wd-40"
homepage = "https://github.com/sunoj/wd-40"
keywords = ["macos", "cleaner", "target", "node-modules", "menubar"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "wd40"
path = "src/lib.rs"

[[bin]]
name = "wd40-menu"
path = "src/main.rs"

[[bin]]
name = "wd40"
path = "src/bin/wd40.rs"

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSObject", "NSString", "NSThread", "NSTimer", "NSDate", "NSObjCRuntime", "NSArray", "NSAttributedString", "NSDictionary", "NSBundle", "NSData", "NSRunLoop", "NSGeometry", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSAnimation", "NSAnimationContext", "NSApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSControl", "NSResponder", "NSImage", "NSImageView", "NSRunningApplication", "NSColor", "NSBezierPath", "NSGraphics", "NSAttributedString", "NSFont", "NSAlert", "NSPanel", "NSWindow", "NSParagraphStyle", "NSStringDrawing", "NSText", "NSCell", "NSButton", "NSButtonCell", "NSTextField", "NSView", "NSViewController", "NSVisualEffectView", "NSBox", "NSPopover", "NSAppearance", "NSStackView", "NSLayoutConstraint", "NSUserInterfaceLayout", "NSBitmapImageRep", "NSSlider", "NSEvent", "NSScrollView", "NSClipView", "NSTrackingArea", "NSWorkspace", "NSOpenPanel", "NSSavePanel"] }
walkdir = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
dirs = "6"
libc = "0.2"
